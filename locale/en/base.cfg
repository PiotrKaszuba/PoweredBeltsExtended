[string-mod-setting-description]
powered-belts-energy-behavior-preset-default=Legacy behavior with entity-dependent startup/shutdown timing.
powered-belts-energy-behavior-preset-synchronized=Preset values targeted to keep belt, underground, and splitter transitions closer together.
powered-belts-energy-behavior-preset-responsive=Like synchronized, but with faster response and built-in hysteresis to reduce flicker.
powered-belts-energy-behavior-preset-custom=Enables detailed startup/runtime settings; defaults match the default preset.

