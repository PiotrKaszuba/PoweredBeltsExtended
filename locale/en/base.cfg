[mod-setting-name]
powered-belts-operations-per-tick=Belts processed per tick:
powered-belts-usage-multiplier=Energy usage multiplier:
powered-belts-required-energy=Required energy to function:
powered-belts-upgrade-reduction=Energy usage reduction per upgrade:

[mod-setting-description]
powered-belts-operations-per-tick=Higher values = worse performance, but belts will update quicker. DEFAULT = 16
powered-belts-usage-multiplier=Scales energy usage of all belts as multiplier value. For value of 1.0 standard transport belts use 5KW energy, default is set at 1KW. DEFAULT = 0.2
powered-belts-required-energy=The energy (J) required for belts to work. Low energy grid will turn belts off. DEFAULT = 500
powered-belts-upgrade-reduction=Fractional reduction of power usage per upgrade, scaling multiplicatively. Value of 0.2 means that first upgrade will reduce energy usage to 80%, second upgrade to 64% etc. DEFAULT = 0.2

[technology-name]
efficient-belts=Belt Transport Efficiency

[technology-description]
efficient-belts=Reduces energy usage of transport and underground belts, splitters and loaders.
